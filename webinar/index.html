<style>
  :root {
    color-scheme: only light;
    --bg: #f3ece0; --paper: #faf6ee;
    --ink: #1c1814; --ink-hair: rgba(28,24,20,.14);
    --night: #14110d;
    --gold: #9a7838; --gold-bright: #c8a160;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    --gutter: clamp(20px, 4vw, 56px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--night); }
  body { background: var(--night); color: var(--paper); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  img { display: block; max-width: 100%; height: auto; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--gold); color: var(--paper); }
  .btn { display: inline-flex; align-items: center; gap: 12px; padding: 17px 26px 17px 28px; border-radius: 999px;
         font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase;
         background: var(--gold); color: var(--paper); border: 1px solid var(--gold); white-space: nowrap;
         transition: transform .25s, background .25s, color .25s, border-color .25s; }
  .btn:hover { background: var(--gold-bright); border-color: var(--gold-bright); color: var(--ink); transform: translateY(-1px); }
  .btn .arrow { transition: transform .25s; } .btn:hover .arrow { transform: translateX(4px); }
  .btn--light { background: var(--paper); color: var(--ink); border-color: var(--paper); } .btn--light:hover { background: var(--gold-bright); border-color: var(--gold-bright); color: var(--ink); }
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: none; }
  .ornament { display: inline-flex; align-items: center; gap: 14px; opacity: .85; }
  .ornament .ln { width: 44px; height: 1px; background: var(--gold-bright); opacity: .6; }
  .ornament .dia { width: 6px; height: 6px; background: var(--gold-bright); transform: rotate(45deg); }

  /* ─── NAV: как на /retreat, светлая поверх тёмного края фото ─── */
  .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 18px var(--gutter); }
  .nav-cta { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; padding: 10px 18px; border-radius: 999px;
             color: var(--paper); border: 1px solid rgba(243,236,224,.65); background: rgba(20,17,13,.28); backdrop-filter: blur(6px); }
  .nav-cta:hover { background: var(--paper); color: var(--ink); border-color: var(--paper); }

  /* ─── HERO: сетка как на /retreat, заголовок в один ряд по обе стороны от Лизы ───
     Кадр показан ЦЕЛИКОМ по высоте и прижат вправо: макушка сверху и цветок снизу не
     срезаются ни при какой пропорции окна. Поле, которое остаётся слева (и полосы сверху
     и снизу на узких окнах), закрывает та же фотография, размытая и притемнённая, поэтому
     стыка не видно, а текст ложится на спокойный тёмный фон.
     --wp    – ширина кадра: всегда по высоте окна (1.4993 = 2000/1334), поэтому по вертикали
               кадр не режется; вправо он при этом может уходить за край окна;
     --face-x – где по горизонтали центр головы: лицо стоит на 49,5 % ширины кадра. Держим его
                на 57 % ширины окна, но не левее, чем даёт кадр, прижатый к правому краю;
     --gap   – зазор под голову между левой и правой колонками текста;
     --col   – ширина левой колонки: от края страницы до зазора. */
  .hero { position: relative; min-height: 100vh; min-height: 100dvh; overflow: hidden; background: var(--night); color: var(--paper);
          --wp: 149.93vh;
          --face-x: max(57vw, calc(100vw - 0.505 * var(--wp)));
          --gap: clamp(300px, 45vh, 580px);
          --col: calc(var(--face-x) - var(--gap) / 2 - var(--gutter));
          --kicker-fs: clamp(15px, 1.05vw, 20px); }
  .hero-photo { position: absolute; inset: 0; z-index: 0; }
  .hero-photo img { position: absolute; top: 0; height: 100%; max-width: none; object-fit: cover; }
  .hero-photo .hero-photo-back { left: 0; width: 100%; object-position: 50% 40%; filter: blur(40px) brightness(.68) saturate(.85); transform: scale(1.2); }
  /* левый край кадра растворяется в размытом фоне, чтобы стыка не было видно */
  .hero-photo .hero-photo-main { left: calc(var(--face-x) - 0.495 * var(--wp)); width: var(--wp);
    -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,0) 0, rgba(0,0,0,1) 180px);
            mask-image: linear-gradient(90deg, rgba(0,0,0,0) 0, rgba(0,0,0,1) 180px); }
  .hero::before { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(20,17,13,.42) 0%, rgba(20,17,13,0) 22%),
      linear-gradient(0deg, rgba(20,17,13,.34) 0%, rgba(20,17,13,0) 30%),
      linear-gradient(90deg, rgba(20,17,13,.80) 0%, rgba(20,17,13,.70) 18%, rgba(20,17,13,.42) 32%, rgba(20,17,13,.10) 44%, rgba(20,17,13,0) 52%),
      linear-gradient(270deg, rgba(20,17,13,.58) 0%, rgba(20,17,13,.42) 18%, rgba(20,17,13,.14) 34%, rgba(20,17,13,0) 44%); }
  .hero-stage { position: relative; z-index: 2; min-height: 100vh; min-height: 100dvh; display: grid;
                grid-template-columns: minmax(0, var(--col)) var(--gap) minmax(0, 1fr);
                align-items: start; align-content: center; padding: 8vh clamp(24px, 4vw, 64px) 14vh var(--gutter); }
  .hero-left { grid-column: 1; justify-self: end; display: flex; flex-direction: column; align-items: flex-start; max-width: 100%; }
  .hero-kicker { font-family: var(--mono); font-size: var(--kicker-fs); line-height: 1.5; letter-spacing: .28em; text-transform: uppercase; color: var(--gold-bright); margin-bottom: 20px; white-space: nowrap; }
  .hero-headline { margin: 0; }
  .hero-title, .hero-aside { display: block; font-family: var(--serif); font-weight: 400; line-height: .92;
                             /* заголовок в один ряд: «Как расцвести» слева, «после 40» справа на той же линии.
                                Размер как на /retreat (10.3vw, до 172px), но не больше, чем влезает «Как расцвести»
                                в левую колонку: фраза занимает ~5.5em в Cormorant */
                             font-size: min(10.3vw, 172px, calc(var(--col) / 5.5)); letter-spacing: -.02em; color: var(--paper);
                             white-space: nowrap; text-shadow: 0 2px 28px rgba(0,0,0,.35); }
  .hero-title .w { display: inline; }
  .hero-aside { font-style: italic; }
  /* «после 40» на базовой линии заголовка: отступ равен высоте надзаголовка (строка + отступ снизу) */
  .hero-aside--side { grid-column: 3; justify-self: start; margin-top: calc(1.5 * var(--kicker-fs) + 20px); }
  .hero-aside--inline { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .hero-inner { padding: 24px 0 0; display: flex; flex-direction: column; align-items: flex-start; gap: 24px; max-width: 100%; }
  .hero .ornament { margin: -6px 0 -2px; }
  .hero-lede { font-family: var(--serif); font-size: clamp(26px, 2.6vw, 46px); line-height: 1.32; color: var(--paper); text-wrap: balance; max-width: 24ch;
               text-shadow: 0 1px 12px rgba(0,0,0,.35); }
  .hero-lede em { font-style: italic; color: var(--gold-bright); }
  .hero-cta { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 4px; }

  @media (max-width: 1140px) {
    .hero { --gap: clamp(220px, 36vh, 340px); }
    .hero-stage { padding-right: clamp(20px, 3vw, 40px); }
    .hero-title, .hero-aside { font-size: min(9vw, 106px, calc(var(--col) / 5.5)); }
    .hero-kicker { white-space: normal; max-width: 100%; letter-spacing: .2em; }
    .hero-cta .btn { padding: 14px 20px 14px 22px; font-size: 11px; }
  }
  @media (max-width: 760px) {
    /* телефон: фото на весь экран, лицо в верхней части, текст внизу поверх тёмной тени */
    /* на телефоне кадр по-прежнему заполняет экран: лицо в верхней части, текст внизу */
    .hero-photo .hero-photo-back { display: none; }
    .hero-photo .hero-photo-main { left: 0; width: 100%; object-position: 50% 18%; -webkit-mask-image: none; mask-image: none; }
    .hero::before { background:
      linear-gradient(180deg, rgba(20,17,13,.30) 0%, rgba(20,17,13,0) 20%),
      linear-gradient(180deg, rgba(20,17,13,0) 34%, rgba(20,17,13,.62) 52%, rgba(20,17,13,.90) 100%); }
    .hero-stage { display: flex; flex-direction: column; justify-content: flex-end; padding: 40vh var(--gutter) 36px; }
    .hero-kicker { margin-bottom: 12px; white-space: normal; line-height: 1.5; }
    .hero-aside--side { display: none; }
    .hero-title { font-size: clamp(50px, 15vw, 76px); white-space: normal; }
    .hero-aside--inline { position: static; width: auto; height: auto; overflow: visible; clip: auto; font-size: clamp(34px, 9.5vw, 48px); line-height: 1.05; margin-top: .08em; }
    .hero-inner { padding-top: 16px; gap: 16px; }
    .hero .ornament { margin: 0; }
    .hero-cta { gap: 10px; }
    .hero-cta .btn { padding: 15px 22px 15px 24px; font-size: 11px; }
    .hero-lede { font-size: 20px; }
  }
</style>
